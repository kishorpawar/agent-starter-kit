# Lint config from day one, so `dart analyze` is a usable signal.
# Needs: flutter pub add --dev flutter_lints
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
  errors:
    # An un-awaited Future fails silently — the Dart version of a missing `await`.
    unawaited_futures: error
    discarded_futures: error

linter:
  rules:
    - avoid_print
    - unawaited_futures
    - discarded_futures
    - always_declare_return_types
    - prefer_final_locals
    - use_build_context_synchronously
